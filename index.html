<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>voyage - sailing simulator</title>
    <style>
      :root {
        --bg: #0c1219;
        --fg: #d6dee7;
        --dim: #5b6b7d;
        --accent: #4fd1c5;
        --warn: #f6c667;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
      #view { display: block; width: 100vw; height: 100vh; }

      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-family: var(--mono);
        color: var(--fg);
      }

      .hud,
      .polarpanel {
        position: absolute;
        padding: 12px;
        background: rgba(10, 16, 22, 0.82);
        border: 1px solid #1e2a36;
        border-radius: 8px;
        backdrop-filter: blur(6px);
      }
      .hud {
        top: 14px;
        left: 14px;
        width: 316px;
      }
      .polarpanel {
        right: 14px;
        bottom: 14px;
        width: 284px;
      }
      .gauges {
        display: grid;
        grid-template-columns: repeat(2, 1fr auto);
        gap: 2px 10px;
        font-size: 11px;
        line-height: 1.7;
      }
      .gauges .k { color: var(--dim); letter-spacing: 0.04em; }
      .gauges .v { text-align: right; font-variant-numeric: tabular-nums; }
      .sailbar {
        position: relative;
        margin-top: 8px;
        height: 17px;
        border: 1px solid #22303d;
        border-radius: 3px;
        overflow: hidden;
        background: #0e1620;
      }
      .sailfill {
        position: absolute;
        inset: 0 auto 0 0;
        background: linear-gradient(90deg, #1d4a4a, #2b6b64);
        transition: width 0.25s ease;
      }
      .sailtext {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9.5px;
        letter-spacing: 0.03em;
        color: var(--fg);
      }
      .warn {
        margin: 7px 0 0;
        min-height: 30px;
        font-size: 10.5px;
        line-height: 1.5;
        color: var(--warn);
        white-space: pre-line;
      }
      .tel {
        display: block;
        width: 292px;
        height: 84px;
        margin-top: 4px;
        border: 1px solid #1c2733;
        border-radius: 4px;
        background: #0b111a;
      }
      .polar {
        display: block;
        width: 260px;
        height: 260px;
      }
      .caption {
        font-size: 10px;
        color: var(--dim);
        text-align: center;
        min-height: 13px;
      }

      .racepanel {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        min-width: 280px;
        padding: 10px 18px 12px;
        text-align: center;
        background: rgba(10, 16, 22, 0.82);
        border: 1px solid #1e2a36;
        border-radius: 8px;
        backdrop-filter: blur(6px);
      }
      .raceclock {
        font-size: 30px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        line-height: 1.1;
      }
      .raceclock.urgent { color: var(--warn); }
      .raceclock.late { color: #e07a8b; }
      .raceclock.done { color: var(--accent); }
      .raceleg {
        margin-top: 2px;
        font-size: 12px;
        color: var(--accent);
      }
      .raceleg.alarm { color: #e07a8b; }
      .raceinfo {
        margin-top: 3px;
        font-size: 11px;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }
      .racelay {
        margin-top: 3px;
        min-height: 14px;
        font-size: 10.5px;
        color: var(--dim);
      }
      .racelay.ok { color: var(--warn); }
      .racebanner {
        position: absolute;
        top: 46%;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 22px;
        font-size: 17px;
        color: var(--fg);
        background: rgba(10, 16, 22, 0.75);
        border: 1px solid #2b3a49;
        border-radius: 8px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.35s ease;
      }

      /* --- Menu, settings, results --- */
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(6, 10, 15, 0.72);
        backdrop-filter: blur(3px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      .overlay.show { opacity: 1; pointer-events: auto; }
      .menucard {
        width: min(520px, 92vw);
        max-height: 92vh;
        overflow-y: auto;
        padding: 26px 30px 24px;
        background: rgba(11, 17, 24, 0.97);
        border: 1px solid #24323f;
        border-radius: 12px;
      }
      .menucard h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 500;
        letter-spacing: 0.16em;
        color: var(--accent);
      }
      .menusub {
        margin: 8px 0 0;
        font-size: 11.5px;
        line-height: 1.65;
        color: var(--dim);
      }
      .menubtns { display: flex; gap: 8px; margin-top: 18px; }
      .menubtns button {
        flex: 1;
        padding: 10px 8px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--fg);
        background: #16212c;
        border: 1px solid #2b3a49;
        border-radius: 6px;
        cursor: pointer;
      }
      .menubtns button:hover { background: #1e2c3a; }
      .menubtns button.primary {
        color: #04211f;
        background: var(--accent);
        border-color: var(--accent);
        font-weight: 600;
      }
      .menubtns button.primary:hover { background: #6ee7dc; }
      .settings { margin-top: 18px; }
      .setrow {
        display: grid;
        grid-template-columns: 118px 1fr 62px;
        align-items: center;
        gap: 10px;
        margin-bottom: 7px;
        font-size: 11px;
        color: var(--dim);
      }
      .setrow input[type='range'] { width: 100%; accent-color: var(--accent); }
      .setval { text-align: right; color: var(--fg); font-variant-numeric: tabular-nums; }
      .menuhint {
        margin: 16px 0 0;
        font-size: 10.5px;
        line-height: 1.8;
        color: var(--dim);
      }
      .menuhint b { color: var(--warn); font-weight: 500; }
      .menuresult:empty { display: none; }
      .menuresult {
        margin-top: 16px;
        padding: 14px;
        background: #101a24;
        border: 1px solid #22303d;
        border-radius: 8px;
      }
      .rtime {
        font-size: 32px;
        text-align: center;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }
      .rbest { margin-top: 4px; text-align: center; font-size: 11px; color: var(--warn); }
      .rdelta { margin-top: 4px; text-align: center; font-size: 11px; color: var(--dim); }
      .rsplits { margin-top: 10px; }
      .rsplit {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 12px;
        font-size: 10.5px;
        line-height: 1.9;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }
      .rsplit .rlap { color: #4a5a6b; min-width: 52px; text-align: right; }

      #keys {
        position: absolute;
        bottom: 14px;
        left: 14px;
        padding: 10px 12px;
        background: rgba(10, 16, 22, 0.82);
        border: 1px solid #1e2a36;
        border-radius: 8px;
        font-size: 10.5px;
        line-height: 1.85;
        color: var(--dim);
      }
      #keys b { color: var(--fg); font-weight: 500; }
      #keys .sec { color: var(--accent); }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="ui">
      <div id="keys">
        <div class="sec">Steering</div>
        <div><b>&larr; &rarr;</b> / <b>A D</b> &nbsp; helm</div>
        <div><b>&uarr; &darr;</b> / <b>W S</b> &nbsp; trim in / ease out</div>
        <div><b>T</b> &nbsp; auto-trim</div>
        <div class="sec" style="margin-top: 6px">Sail plan</div>
        <div><b>1 2 3 4</b> &nbsp; reef 0-3</div>
        <div><b>F G</b> &nbsp; furl / unfurl jib</div>
        <div><b>Y</b> &nbsp; auto-reef</div>
        <div class="sec" style="margin-top: 6px">Conditions</div>
        <div><b>Q E</b> &nbsp; mean wind direction &nbsp; <b>[ ]</b> &nbsp; speed</div>
        <div class="sec" style="margin-top: 6px">Other</div>
        <div><b>C</b> camera &nbsp; <b>P</b> polar &nbsp; <b>R</b> restart &nbsp; <b>M</b> sound</div>
        <div><b>Esc</b> &nbsp; menu / settings</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
