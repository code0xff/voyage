name: verify

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, test, build and polar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run verify

      - name: Build production bundle
        run: npm run build

      # The root build is the normal artifact, but it cannot expose a runtime
      # path that accidentally starts at `/`: at `/`, a broken asset URL looks
      # correct. Build once at the project-page base as well, where the six
      # surveyed rasters and the generated notices would otherwise all miss.
      - name: Build production bundle at a subpath
        run: npm run build
        env:
          VOYAGE_BASE: /voyage/

      - name: Validate subpath asset URLs
        run: npm run check:base -- dist /voyage/

      - name: Validate published polar points
        run: npm run polar -- 6 12 25 35
