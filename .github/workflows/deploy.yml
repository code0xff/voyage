name: deploy

# Every push to `dev`, and on request.
#
# It was manual only while there was nowhere to publish to: firing it on every
# push would have meant publishing continuously to somewhere that did not
# exist, or sitting red. There is a GitHub Pages site now, `dev` is the only
# branch, and a site that lags the branch by however long it takes someone to
# remember to press a button is a site nobody can trust to be the game.
#
# The manual form stays, and keeps its inputs: it is how the artifact is built
# for anywhere that is not Pages, and how a base other than the project path
# gets tried before it is needed.
#
# It builds the same tree twice over from `verify`, which is the point: this
# asserts that the *deployed* build works at the base it will be served from,
# and `verify` asserts nothing about the base at all.
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      base:
        description: 'Path the app is served from, with both slashes. Leave empty to let the target decide: "/" for an artifact, the project path for Pages.'
        required: false
        default: ''
      publish:
        description: 'Where the build goes.'
        required: false
        default: github-pages
        type: choice
        options:
          - github-pages
          - artifact

permissions:
  contents: read

# One deploy at a time, and the newest one wins. Pushes come in bursts -- a
# feature and the docs commit behind it -- and a queue of them would publish
# the older tree over the newer as each finished.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Empty by default rather than `/`, because `/` is right for an artifact
      # and wrong for a project page -- and a default that is silently wrong for
      # one of only two targets is the worst kind: selecting Pages and taking
      # the default produced root-relative bundle URLs and a dead deployment,
      # with nothing at any stage saying so.
      #
      # A user or organisation page is served at the root and is the repository
      # named `<owner>.github.io`; everything else is a project page under
      # `/<repo>/`. Read through the environment rather than interpolated into
      # the script, so a hand-typed base is data and never shell.
      - name: Decide the base
        id: base
        env:
          GIVEN: ${{ inputs.base }}
          # A push carries no inputs, and the answer for a push is the site.
          PUBLISH: ${{ inputs.publish || 'github-pages' }}
          REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          base="$GIVEN"
          if [ -z "$base" ]; then
            if [ "$PUBLISH" = 'github-pages' ] && [ "$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')" != "$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]').github.io" ]; then
              base="/$REPO/"
            else
              base='/'
            fi
          fi
          echo "Building for '$base'"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Verify source
        run: npm run verify

      - name: Build production bundle
        run: npm run build
        env:
          VOYAGE_BASE: ${{ steps.base.outputs.base }}

      # The failure this guards is silent and only appears at a subpath: the
      # models, the attribution notices and the six surveyed rasters are fetched
      # at runtime, so Vite never sees those strings and cannot rewrite them.
      # Written absolute they resolve against the origin, and every one of them
      # comes back as the index page. See `src/asset.ts`.
      - name: Check every runtime path carries the base
        run: npm run check:base -- dist "${{ steps.base.outputs.base }}"

      - name: Upload the built site
        uses: actions/upload-artifact@v7
        with:
          name: voyage-dist
          path: dist
          if-no-files-found: error

      - name: Upload for Pages
        if: (inputs.publish || 'github-pages') == 'github-pages'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Split out because deploying needs write permissions the build has no use
  # for, and a job that only ever runs on request should not be the one holding
  # them for the build as well.
  pages:
    name: publish to GitHub Pages
    if: (inputs.publish || 'github-pages') == 'github-pages'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
